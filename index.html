<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pomppukeppi</title>
<style>
html,body{margin:0;height:100%;background:#0b1020;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#7ad0ff;outline:none}
@media (max-width: 768px) {
  canvas { width: 100vw !important; height: 100vh !important; }
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const W=480,H=720,GOAL=2500,PX=10;
const G=0.45,JUMP=13.0,BIRD_B=17,PLANE_B=24;
const BUF=18,CD=42;
const ITEMS=[
 {id:'stick',name:'Parempi keppi',desc:'Hyppy korkeammalle',costs:[20,40,70,110,160]},
 {id:'spring',name:'Boostijousi',desc:'Lintu- ja lentokoneboostit vahvempia',costs:[30,60,100,150]},
 {id:'rate',name:'Nopea lataus',desc:'Suojapainike latautuu nopeammin',costs:[25,50,80,120]},
 {id:'shield',name:'Suojakilpi',desc:'Torjuu yhden putoamisen (max 3)',costs:[25,25,25]}
];
let save={coins:0,stick:0,spring:0,rate:0,shield:0};
try{Object.assign(save,JSON.parse(localStorage.getItem('pomppukeppi')||'{}'));}catch(e){}
function persist(){try{localStorage.setItem('pomppukeppi',JSON.stringify(save));}catch(e){}}
const jumpV=()=>JUMP+.6*save.stick,boostMul=()=>1+.09*save.spring,cdV=()=>CD-5*save.rate;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let scale=1;
function resize(){
  const isMobile = innerWidth <= 768;
  let w, h;
  if(isMobile) {
    w = innerWidth; h = innerHeight;
  } else {
    w = Math.min(innerWidth, innerHeight * W / H);
    h = w * H / W;
  }
  const d = devicePixelRatio || 1;
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  cv.width = Math.round(w * d); cv.height = Math.round(h * d);
  scale = cv.width / W;
}
addEventListener('resize',resize);resize();

/* ---------- Syötteet ---------- */
const keys={};
const KEYMAP={ArrowLeft:'L',KeyA:'L',ArrowRight:'R',KeyD:'R',Space:'J',ArrowUp:'J',KeyW:'J'};
function onKey(e,down){
  if(down&&state==='shop'){
    if(/^Digit[1-4]$/.test(e.code)){buy(+e.code[5]-1);e.preventDefault();return;}
    if(e.code==='Escape'||e.code==='Enter'){state='start';return;}
  }
  const k=KEYMAP[e.code]||(e.key==='ArrowLeft'?'L':e.key==='ArrowRight'?'R':e.key===' '?'J':null);
  if(!k)return;
  e.preventDefault();
  if(down){
    if(e.repeat)return;
    keys[k]=true;
    if(k==='J')action();
    else if(state!=='play'&&state!=='shop')action();
  }else keys[k]=false;
}
window.addEventListener('keydown',e=>onKey(e,true),true);
window.addEventListener('keyup',e=>onKey(e,false),true);
window.addEventListener('blur',()=>{keys.L=keys.R=false;});
window.focus();
cv.tabIndex=0;cv.addEventListener('pointerdown',()=>{window.focus();cv.focus();});

let touchL=false, touchR=false;
const btnsUI = {
  left:  {x: 20,  y: H - 80, w: 70, h: 60},
  right: {x: 100, y: H - 80, w: 70, h: 60},
  action:{x: W - 90, y: H - 80, w: 70, h: 60}
};

const ptrs=new Map();
function updTouch(){
  let l=false, r=false;
  for(const pos of ptrs.values()){
    if(pos.x >= btnsUI.left.x && pos.x <= btnsUI.left.x + btnsUI.left.w &&
       pos.y >= btnsUI.left.y && pos.y <= btnsUI.left.y + btnsUI.left.h) l = true;
    if(pos.x >= btnsUI.right.x && pos.x <= btnsUI.right.x + btnsUI.right.w &&
       pos.y >= btnsUI.right.y && pos.y <= btnsUI.right.y + btnsUI.right.h) r = true;
  }
  touchL=l; touchR=r;
}

cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect();
  const px=(e.clientX-r.left)/r.width*W, py=(e.clientY-r.top)/r.height*H;
  ptrs.set(e.pointerId, {x: px, y: py});
  
  if(state==='play'){
    if(px >= btnsUI.action.x && px <= btnsUI.action.x + btnsUI.action.w &&
       py >= btnsUI.action.y && py <= btnsUI.action.y + btnsUI.action.h){
      action();
    }
  } else {
    for(const b of btns) if(px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h){b.fn();break;}
  }
  updTouch();
  e.preventDefault();
});
['pointerup','pointercancel','pointerleave'].forEach(n=>cv.addEventListener(n,e=>{
  ptrs.delete(e.pointerId); updTouch();
}));

/* ---------- Peli ---------- */
let state='start',p,clouds,enemies,pickups,texts,camY,nextY,nextBird,nextPlane,maxAlt,moonMade,moonY,tick=0,endMs=0;
const stars=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.4}));

function reset(){
  p={x:W/2,y:0,vx:0,vy:-jumpV(),drop:0,buf:0,cd:0,face:1,squash:0,inv:0,shields:save.shield, oxygen:100};
  clouds=[{t:'n',x:W/2,y:0,w:100,vx:0}]; enemies=[]; pickups=[]; texts=[];
  camY=-H*.75;nextY=0;maxAlt=0;moonMade=false;moonY=0;nextBird=25;nextPlane=100;
  gen();
}
function startGame(){reset();state='play';}
function action(){
  if(state==='play')tryJump();
  else if(performance.now()-endMs>600)startGame();
}
function tryJump(){if(state!=='play'||p.cd>0)return;p.buf=BUF;p.cd=cdV();}

function gen(){
  while(nextY>camY-300&&!moonMade){
    const alt=-nextY/PX;
    if(alt>GOAL-10){moonY=nextY-95;clouds.push({t:'m',x:W/2,y:moonY,w:W+60,vx:0});moonMade=true;break;}
    nextY-=55+Math.random()*50;
    
    const count = Math.random() < 0.6 ? 2 : 1;
    for(let i=0; i<count; i++){
      const x=40+Math.random()*(W-80), w=Math.max(50, 72-alt/60);
      const moving = alt > 40 && Math.random() < 0.35;
      const vx = moving ? (Math.random() < 0.5 ? 1 : -1) * (0.8 + Math.random()*0.8) : 0;
      
      const isThunder = alt > 150 && alt < 1600 && Math.random() < 0.15;
      clouds.push({t: isThunder ? 's' : 'n', x, y: nextY, w, vx});

      if(Math.random() < 0.22){
        const pType = (alt >= 1400 && Math.random() < 0.5) ? 'oxygen' : (Math.random() < 0.15 ? 'shield' : 'coin');
        pickups.push({t: pType, x: x + (Math.random()*30 - 15), y: nextY - 25, got: false});
      }
    }
  }
}

function spawn(kind){
  const dir=Math.random()<.5?1:-1, plane=kind==='plane';
  const y=camY+70+Math.random()*H*.4;
  enemies.push({kind,x:dir>0?-70:W+70,by:y,y,dir,speed:plane?4.2:2.1,w:plane?74:34,h:plane?26:18,t:0});
}

function say(s,col){texts.push({x:p.x,y:p.y-70,s,col,t:70});}
function knock(dist,msg){
  if(p.buf>0){p.buf=0;p.inv=30;say('Torjuit!','#8fd3ff');return;}
  if(p.shields>0){p.shields--;p.inv=45;say('Suoja kului!','#8fd3ff');return;}
  p.drop=dist;p.vy=Math.max(p.vy,5);say(msg,'#ff5a4a');
}

function hitEnemy(e,stomp){
  e.hit=true;
  const plane=e.kind==='plane';
  if(stomp){
    e.dead=true;p.vy=-(plane?PLANE_B:BIRD_B)*boostMul();p.drop=0;p.buf=0;
    say(plane?'TUPLABOOSTI!!':'BOOSTI!',plane?'#ffd23a':'#5dff8a');
  }else knock(plane?320:160, plane ? 'Lentokone! Putoat!' : 'Lintu! Putoat!');
}

function update(){
  tick++;
  let ax=0;
  if(keys.L||touchL)ax-=1;
  if(keys.R||touchR)ax+=1;
  
  p.vx+=(ax*5.2-p.vx)*.2;if(ax)p.face=ax>0?1:-1;
  p.x+=p.vx;if(p.x<-12)p.x=W+12;else if(p.x>W+12)p.x=-12;
  
  texts.forEach(t=>{t.y-=.6;t.t--;});texts=texts.filter(t=>t.t>0);
  if(p.squash>0)p.squash--;
  if(state==='win'){p.vy+=G*.3;p.y+=p.vy;if(p.y>=moonY){p.y=moonY;p.vy=-5;}return;}
  if(p.buf>0)p.buf--;if(p.cd>0)p.cd--;
  
  const currentAlt = Math.max(0, -p.y/PX);
  
  if(currentAlt >= 1400){
    p.oxygen -= 0.05;
    if(p.oxygen <= 0){
      p.oxygen = 0;
      knock(200, 'Happi loppui!');
    }
  }

  const prev=p.y;
  p.vy=Math.min(p.vy+G,14);p.y+=p.vy;
  
  for(const c of clouds){
    if(c.vx){
      c.x += c.vx;
      if(c.x < 30 || c.x > W - 30) c.vx *= -1;
    }
  }

  if(p.vy>0&&p.drop<=0){
    for(const c of clouds){
      if(c.t==='s')continue;
      if(prev<=c.y&&p.y>=c.y&&Math.abs(p.x-c.x)<c.w/2+8){
        p.y=c.y;
        if(c.t==='m'){endRun(true);say('KUUSSA!','#fff');return;}
        p.vy=-jumpV();p.squash=8;break;
      }
    }
  }
  
  for(const item of pickups){
    if(!item.got && Math.hypot(p.x - item.x, (p.y-26) - item.y) < 24){
      item.got = true;
      if(item.t === 'coin'){ save.coins += 5; say('+5 Kolikkoa!', '#ffd23a'); }
      else if(item.t === 'shield'){ p.shields++; say('+1 Suoja!', '#8fd3ff'); }
      else if(item.t === 'oxygen'){ p.oxygen = Math.min(100, p.oxygen + 45); say('+Happea!', '#4afebe'); }
    }
  }

  if(p.drop>0&&p.vy>0)p.drop-=p.vy;
  if(p.inv>0)p.inv--;
  
  if(p.drop<=0){
    for(const e of enemies){
      if(e.hit)continue;
      if(Math.abs(e.x-p.x)<e.w/2+9&&Math.abs(e.y-(p.y-26))<e.h/2+28){
        const stomp=p.vy>0&&prev<=e.y+6;
        if(stomp||p.inv<=0){hitEnemy(e,stomp);break;}
      }
    }
    if(p.inv<=0)for(const c of clouds){
      if(c.t==='s'&&Math.abs(c.x-p.x)<c.w/2+6&&p.y>c.y-16&&p.y-54<c.y+26){
        c.zap=tick; knock(160, currentAlt >= 1400 ? 'Meteori! Putoat!' : 'Ukkospilvi! Putoat!'); break;
      }
    }
  }
  
  maxAlt=Math.max(maxAlt, currentAlt);
  if(p.y-54<camY+H*.38)camY=p.y-54-H*.38;
  
  const topAlt=-camY/PX, nearMoon=moonMade||topAlt>GOAL-40;
  if(!nearMoon){
    if(topAlt>=nextBird){spawn('bird');nextBird+=40+Math.random()*55;}
    if(topAlt>=nextPlane){spawn('plane');nextPlane+=180+Math.random()*180;}
  }
  
  for(const e of enemies){
    e.t++;e.x+=e.dir*e.speed;
    if(e.dead)e.by+=6;
    e.y=e.by+(e.kind==='bird'&&!e.dead?Math.sin(e.t/12)*10:0);
  }
  enemies=enemies.filter(e=>e.x>-120&&e.x<W+120&&e.y<camY+H+100);
  pickups=pickups.filter(pk=>!pk.got && pk.y<camY+H+100);
  if(tick%30===0)clouds=clouds.filter(c=>c.t==='m'||c.y<camY+H+120);
  gen();
  if(p.y>camY+H+70)endRun(false);
}

/* ---------- Piirto ---------- */
const stops=[[0,[125,208,255]],[.35,[45,100,210]],[.65,[12,20,80]],[1,[3,4,18]]];
function skyCol(t){
  t=Math.max(0,Math.min(1,t));
  for(let i=1;i<stops.length;i++){
    if(t<=stops[i][0]){const a=stops[i-1],b=stops[i],k=(t-a[0])/(b[0]-a[0]);
      return 'rgb('+a[1].map((v,j)=>Math.round(v+(b[1][j]-v)*k)).join(',')+')';}
  }
  return 'rgb(3,4,18)';
}
const LAYERS=[[0,'Troposfääri'],[.25,'Stratosfääri'],[.55,'Mesosfääri'],[.8,'Avaruus']];

function drawCloud(c){
  const x=c.x, y=c.y, w=c.w, alt = -y/PX;
  if(alt >= 1400){ // Meteori / avaruusromu
    ctx.fillStyle='#6e655f';
    ctx.beginPath();ctx.arc(x,y+14,w/2.5,0,7);ctx.fill();
    ctx.fillStyle='#4a433e';
    ctx.beginPath();ctx.arc(x-6,y+8,6,0,7);ctx.fill();
    return;
  }
  if(c.t==='s'){
    ctx.fillStyle='#4b5066';
    ctx.beginPath();ctx.ellipse(x,y+16,w/2,10,0,0,7);ctx.fill();
    for(const [dx,r] of [[-.27,13],[0,17],[.27,13]]){ctx.beginPath();ctx.arc(x+dx*w,y+6,r,0,7);ctx.fill();}
    if(c.zap&&tick-c.zap<20||(tick+Math.floor(c.x))%100<12){
      ctx.fillStyle='rgba(255,255,150,.25)';ctx.beginPath();ctx.arc(x,y+14,34,0,7);ctx.fill();
      ctx.fillStyle='#ffe44a';ctx.beginPath();
      ctx.moveTo(x-3,y+20);ctx.lineTo(x+6,y+20);ctx.lineTo(x+1,y+32);ctx.lineTo(x+7,y+32);ctx.lineTo(x-6,y+54);ctx.lineTo(x-3,y+37);ctx.lineTo(x-8,y+37);ctx.fill();
    }
    return;
  }
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.ellipse(x,y+18,w/2,9,0,0,7);ctx.fill();
  for(const [dx,r] of [[-.25,11],[0,14],[.25,11]]){ctx.beginPath();ctx.arc(x+dx*w,y+13,r,0,7);ctx.fill();}
  ctx.fillStyle='rgba(150,190,230,.35)';ctx.beginPath();ctx.ellipse(x,y+23,w/2-4,4,0,0,7);ctx.fill();
}

function drawEnemy(e){
  ctx.save();ctx.translate(e.x,e.y);ctx.scale(e.dir,1);
  if(e.dead)ctx.rotate(.8);
  const alt = -e.y/PX;

  if(e.kind==='bird'){
    if(alt < 600){ // Pikkulintu (alkuperäinen tarkka piirto)
      const wy=Math.sin(e.t*.5)*10;
      ctx.fillStyle='#3a2a1a';ctx.beginPath();ctx.ellipse(0,0,11,6,0,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(10,-2,5,0,7);ctx.fill();
      ctx.fillStyle='#f0a030';ctx.beginPath();ctx.moveTo(15,-3);ctx.lineTo(21,-1);ctx.lineTo(15,0);ctx.fill();
      ctx.fillStyle='#5a432b';ctx.beginPath();ctx.moveTo(-6,-2);ctx.lineTo(3,-2);ctx.lineTo(-2,-2-wy*1.2);ctx.fill();
    } else { // Kotka
      ctx.fillStyle='#2b1a0e';ctx.beginPath();ctx.ellipse(0,0,15,7,0,0,7);ctx.fill();
      ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(13,-3,6,0,7);ctx.fill();
      ctx.fillStyle='#f0b000';ctx.beginPath();ctx.moveTo(18,-3);ctx.lineTo(25,1);ctx.lineTo(18,3);ctx.fill();
      ctx.fillStyle='#402b1c';ctx.beginPath();ctx.moveTo(-10,-2);ctx.lineTo(5,-2);ctx.lineTo(-4,-12);ctx.fill();
    }
  } else {
    if(alt < 700){ // Potkurikone (alkuperäinen tarkka piirto)
      ctx.fillStyle='#f4f6fa';ctx.beginPath();ctx.ellipse(0,0,36,8,0,0,7);ctx.fill();
      ctx.fillStyle='#9aa7bd';ctx.beginPath();ctx.moveTo(-5,2);ctx.lineTo(7,2);ctx.lineTo(-8,18);ctx.lineTo(-17,18);ctx.fill();
      ctx.fillStyle='#e0483a';ctx.beginPath();ctx.moveTo(-28,-2);ctx.lineTo(-20,-2);ctx.lineTo(-30,-15);ctx.lineTo(-35,-15);ctx.fill();
      ctx.fillStyle='#4a6a9a';for(let i=0;i<5;i++){ctx.beginPath();ctx.arc(-12+i*6,-2,2,0,7);ctx.fill();}
      ctx.beginPath();ctx.ellipse(28,-2,5,3,0,0,7);ctx.fill();
    } else if(alt < 1400){ // Suihkukone
      ctx.fillStyle='#e6e9ed';ctx.beginPath();ctx.ellipse(0,0,38,8,0,0,7);ctx.fill();
      ctx.fillStyle='#656d78';ctx.beginPath();ctx.moveTo(-8,2);ctx.lineTo(10,2);ctx.lineTo(-12,20);ctx.lineTo(-24,20);ctx.fill();
      ctx.fillStyle='#4a90e2';for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(-10+i*6,0,1.5,0,7);ctx.fill();}
      ctx.fillStyle='#da4453';ctx.beginPath();ctx.moveTo(-32,-2);ctx.lineTo(-22,-2);ctx.lineTo(-34,-12);ctx.fill();
    } else { // Raketti / UFO
      if(Math.floor(e.x)%2===0){ // Raketti
        ctx.fillStyle='#f5f7fa';ctx.beginPath();ctx.ellipse(0,0,26,8,0,0,7);ctx.fill();
        ctx.fillStyle='#ed5565';ctx.beginPath();ctx.moveTo(18,-8);ctx.lineTo(28,0);ctx.lineTo(18,8);ctx.fill();
        ctx.fillStyle='#4fc1e9';ctx.beginPath();ctx.arc(5,0,3,0,7);ctx.fill();
      } else { // UFO
        ctx.fillStyle='#a0d468';ctx.beginPath();ctx.arc(0,-4,8,0,7);ctx.fill();
        ctx.fillStyle='#48cfad';ctx.beginPath();ctx.ellipse(0,2,22,6,0,0,7);ctx.fill();
        ctx.fillStyle='#ffce54';for(let i=0;i<5;i++){ctx.beginPath();ctx.arc(-12+i*6,3,1.5,0,7);ctx.fill();}
      }
    }
  }
  ctx.restore();
}

function drawPickup(pk){
  ctx.save(); ctx.translate(pk.x, pk.y);
  if(pk.t === 'coin'){
    ctx.fillStyle = '#ffd23a'; ctx.beginPath(); ctx.arc(0,0,8,0,7); ctx.fill();
    ctx.fillStyle = '#e5b800'; ctx.font='bold 10px sans-serif'; ctx.textAlign='center'; ctx.fillText('$',0,3.5);
  } else if(pk.t === 'shield'){
    ctx.fillStyle = '#5d9cec'; ctx.beginPath(); ctx.arc(0,0,9,0,7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font='bold 10px sans-serif'; ctx.textAlign='center'; ctx.fillText('S',0,3.5);
  } else if(pk.t === 'oxygen'){
    ctx.fillStyle = '#4afebe'; ctx.fillRect(-5,-8,10,16);
    ctx.fillStyle = '#fff'; ctx.fillRect(-2,-10,4,2);
  }
  ctx.restore();
}

function drawPlayer(){
  ctx.save();ctx.translate(p.x,p.y);
  const alt = -p.y/PX;
  if(p.buf>0){ctx.strokeStyle='rgba(255,230,90,'+(p.buf/BUF)+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,-28,36,0,7);ctx.stroke();}
  if(p.vy<-14){ctx.strokeStyle='rgba(255,200,60,.7)';ctx.lineWidth=3;
    for(const dx of [-6,0,6]){ctx.beginPath();ctx.moveTo(dx,4);ctx.lineTo(dx,4-p.vy*1.4);ctx.stroke();}}
    
  const s=p.squash/8,top=-18+s*7;
  ctx.lineCap='round';ctx.lineJoin='round';
  
  if(alt >= 1400){ // Avaruuspuku
    ctx.strokeStyle='#e6e9ed';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(0,top-4);ctx.lineTo(0,top-24);ctx.stroke();
    ctx.strokeStyle='#aab2bd';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-5,top-2);ctx.lineTo(-7,top+3);ctx.moveTo(5,top-2);ctx.lineTo(7,top+3);ctx.stroke();
    ctx.fillStyle='#4a90e2';ctx.beginPath();ctx.arc(0,top-30,8,0,7);ctx.fill(); // Kypärä
    ctx.fillStyle='#ffce54';ctx.beginPath();ctx.arc(3*p.face,top-30,5,0,7);ctx.fill(); // Visiiri
  } else { // Alkuperäinen tarkka ukkeli
    ctx.strokeStyle='#e0483a';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(0,top-4);ctx.lineTo(0,top-24);ctx.stroke();
    ctx.strokeStyle='#234';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-5,top-2);ctx.lineTo(-7,top+3);ctx.moveTo(5,top-2);ctx.lineTo(7,top+3);ctx.stroke();
    ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,top-32,7,0,7);ctx.fill();
    ctx.fillStyle='#2a5bd7';ctx.beginPath();ctx.arc(0,top-34,7,Math.PI,0);ctx.fill();
  }
  
  ctx.strokeStyle='#555';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,top);ctx.stroke();
  ctx.strokeStyle='#999';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-5,top+2);
  for(let i=0;i<5;i++)ctx.lineTo(i%2?-5:5,top+2+(i+1)*(-top-4)/6);ctx.stroke();
  ctx.strokeStyle='#555';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-8,top-16);ctx.lineTo(8,top-16);ctx.stroke();
  ctx.restore();
}

let btns=[],earned=0;
function endRun(win){
  state=win?'win':'dead';endMs=performance.now();
  earned=Math.floor(maxAlt/10)+(win?100:0);
  save.coins+=earned;save.shield=p.shields;persist();
}

function buy(i){
  const it=ITEMS[i],l=save[it.id];if(l>=it.costs.length)return;
  const c=it.costs[l];if(save.coins<c)return;
  save.coins-=c;save[it.id]=l+1;persist();
}

function button(label,x,y,w,h,fn,on=true){
  ctx.fillStyle=on?'#2a7de1':'#555';ctx.fillRect(x,y,w,h);
  ctx.fillStyle='#fff';ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.fillText(label,x+w/2,y+h/2+5);
  if(on)btns.push({x,y,w,h,fn});
}

function play(){if(performance.now()-endMs>400)startGame();}

function panel(title,lines){
  ctx.fillStyle='rgba(0,0,20,.75)';ctx.fillRect(30,110,W-60,420);
  ctx.fillStyle='#fff';ctx.textAlign='center';
  ctx.font='bold 28px sans-serif';ctx.fillText(title,W/2,155);
  ctx.font='13px sans-serif';
  lines.forEach((l,i)=>ctx.fillText(l,W/2,195+i*20));
  button('Pelaa',50,470,150,42,play);
  button('Kauppa',W-200,470,150,42,()=>{state='shop';});
}

function drawUIControls(){
  ctx.fillStyle='rgba(255,255,255,0.2)';
  ctx.fillRect(btnsUI.left.x, btnsUI.left.y, btnsUI.left.w, btnsUI.left.h);
  ctx.fillRect(btnsUI.right.x, btnsUI.right.y, btnsUI.right.w, btnsUI.right.h);
  ctx.fillStyle = p.cd > 0 ? 'rgba(255,100,100,0.2)' : 'rgba(100,255,100,0.3)';
  ctx.fillRect(btnsUI.action.x, btnsUI.action.y, btnsUI.action.w, btnsUI.action.h);

  ctx.fillStyle='#fff'; ctx.font='bold 22px sans-serif'; ctx.textAlign='center';
  ctx.fillText('◄', btnsUI.left.x + 35, btnsUI.left.y + 38);
  ctx.fillText('►', btnsUI.right.x + 35, btnsUI.right.y + 38);
  ctx.fillText('🛡️', btnsUI.action.x + 35, btnsUI.action.y + 38);
}

function draw(){
  ctx.setTransform(scale,0,0,scale,0,0);
  const altC=Math.max(0,-(camY+H/2)/PX),t=altC/GOAL;
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,skyCol(t+.12));g.addColorStop(1,skyCol(t-.05));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  
  const sa=Math.max(0,Math.min(1,(t-.3)*2.2));
  if(sa>0){ctx.fillStyle='rgba(255,255,255,'+sa+')';
    for(const s of stars){const y=((s.y-camY*.05)%H+H)%H;ctx.beginPath();ctx.arc(s.x,y,s.r,0,7);ctx.fill();}}
    
  ctx.save();ctx.translate(0,-camY);
  if(moonMade){
    const cy=moonY+430,gl=ctx.createRadialGradient(W/2,cy,430,W/2,cy,520);
    gl.addColorStop(0,'rgba(255,255,220,.35)');gl.addColorStop(1,'rgba(255,255,220,0)');
    ctx.fillStyle=gl;ctx.beginPath();ctx.arc(W/2,cy,520,0,7);ctx.fill();
    ctx.fillStyle='#dcdcd2';ctx.beginPath();ctx.arc(W/2,cy,430,0,7);ctx.fill();
  }
  for(const c of clouds)if(c.t!=='m')drawCloud(c);
  for(const pk of pickups) drawPickup(pk);
  for(const e of enemies)drawEnemy(e);
  drawPlayer();
  
  ctx.textAlign='center';ctx.font='bold 18px sans-serif';
  for(const tx of texts){ctx.fillStyle=tx.col;ctx.globalAlpha=Math.min(1,tx.t/20);ctx.fillText(tx.s,tx.x,tx.y);}
  ctx.globalAlpha=1;
  ctx.restore();
  
  const alt=Math.floor(Math.max(0,maxAlt)),prog=Math.min(1,maxAlt/GOAL);
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(0,0,W,30);
  ctx.fillStyle='#ffd23a';ctx.fillRect(0,0,W*prog,4);
  ctx.fillStyle='#fff';ctx.font='bold 15px sans-serif';ctx.textAlign='left';ctx.fillText('▲ '+alt+' m / '+GOAL+' m',8,22);
  
  let ln=LAYERS[0][1];for(const l of LAYERS)if(t>=l[0])ln=l[1];
  ctx.textAlign='right';ctx.font='13px sans-serif';ctx.fillText(ln,W-8,21);
  
  if(state==='play'){
    if(p.shields>0){ctx.fillStyle='#8fd3ff';ctx.textAlign='left';ctx.font='13px sans-serif';ctx.fillText('Suojia: '+p.shields,8,48);}
    
    if(alt >= 1400){
      ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(W-110,40,100,12);
      ctx.fillStyle='#4afebe';ctx.fillRect(W-110,40,p.oxygen,12);
      ctx.fillStyle='#fff';ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillText('HAPPI',W-60,50);
    }
    
    drawUIControls();
  }
  
  ctx.textAlign='center';btns=[];
  if(state==='start')panel('POMPPUKEPPI',[
    'Ohjaus: Nuolet / Ruutunäppäimet','Suojapainike: Välilyönti / 🛡️-nappi','',
    'Hyppää lintujen ja lentokoneiden PÄÄLLE:','boosti! (lentokone = tuplaboosti)','Osuma sivulta tai alta pudottaa.','',
    'Kerää kolikoita, suojia ja happea.','Tavoite: Kuu ('+GOAL+' m) | Kolikot: '+save.coins
  ]);
  else if(state==='dead')panel('Putosit!',['Korkein: '+alt+' m','Saat kolikoita: +'+earned,'Kolikot yhteensä: '+save.coins]);
  else if(state==='win')panel('KUUSSA!',['Pääsit '+GOAL+' metrin korkeuteen!','Saat kolikoita: +'+earned,'Kolikot yhteensä: '+save.coins]);
  else if(state==='shop'){
    ctx.fillStyle='rgba(0,0,20,.85)';ctx.fillRect(15,30,W-30,H-60);
    ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('KAUPPA',W/2,78);
    ctx.fillStyle='#ffd23a';ctx.font='bold 16px sans-serif';ctx.fillText('Kolikot: '+save.coins,W/2,104);
    ITEMS.forEach((it,i)=>{
      const y=124+i*104,l=save[it.id],max=it.costs.length,full=l>=max,c=it.costs[l];
      ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 15px sans-serif';
      ctx.fillText((i+1)+'. '+it.name+'  ('+(it.id==='shield'?'omistat '+l:'taso '+l+'/'+max)+')',24,y+16);
      ctx.font='13px sans-serif';ctx.fillStyle='#cfe';ctx.fillText(it.desc,24,y+36);
      button(full?'Täynnä':'Osta ('+c+' kolikkoa)',24,y+48,W-48,34,()=>buy(i),!full&&save.coins>=c);
    });
    button('Takaisin',24,H-100,W-48,34,()=>{state='start';});
  }
}

reset();
let last=0,acc=0;
function loop(now){
  acc+=Math.min(100,now-last);last=now;
  while(acc>=16.667){if(state==='play'||state==='win')update();acc-=16.667;}
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
